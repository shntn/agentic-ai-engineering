[project]
name = "lesson-memory-systems"
version = "0.1.0"
description = "Three-tier agent memory — working, episodic, and semantic persistence"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.76.0",
    "openrouter>=1.1.74",  # OpenRouter API client
    "chromadb>=0.5.0",
    "janome>=0.5.0",  # memory_openrouter/episodic.py の日本語キーワード検索用
    "sentence-transformers>=3.0.0",  # memory_openrouter/semantic.py の多言語埋め込み用
    "common",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
